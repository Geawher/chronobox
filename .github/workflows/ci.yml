name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests vm
      - run: uv run ruff format --check src tests vm
      # VM tests need /dev/kvm and a built image; they are skipped automatically here.
      - run: uv run pytest -q
