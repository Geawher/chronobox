[project]
name = "chronobox"
version = "0.2.0"
description = "A Linux machine with exact undo and forks for coding agents (MCP server, Firecracker microVMs)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jawher Jabri" }]
requires-python = ">=3.12"
dependencies = ["mcp>=2.3.0"]
keywords = ["mcp", "ai-agents", "coding-agents", "firecracker", "microvm", "snapshots", "claude-code", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Geawher/chronobox"
Issues = "https://github.com/Geawher/chronobox/issues"
Changelog = "https://github.com/Geawher/chronobox/blob/main/CHANGELOG.md"
Benchmark = "https://github.com/Geawher/chronobox-ops"

[project.scripts]
chronobox = "chronobox.cli:main"
chronobox-mcp = "chronobox.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronobox"]

[tool.hatch.build.targets.wheel.force-include]
# The tools drive and default image sources, so an installed chronobox can build them.
"vm/tools" = "chronobox/vm/tools"
"vm/images" = "chronobox/vm/images"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["vm: needs /dev/kvm and the VM files (`chronobox setup`)"]
