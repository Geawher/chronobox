[project]
name = "chronobox"
version = "0.1.0"
description = "A Linux machine with exact undo and forks for coding agents (MCP server, Firecracker microVMs)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mcp>=2.3.0"]

[project.scripts]
chronobox = "chronobox.cli:main"
chronobox-mcp = "chronobox.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronobox"]

[tool.hatch.build.targets.wheel.force-include]
# The tools drive and default image sources, so an installed chronobox can build them.
"vm/tools" = "chronobox/vm/tools"
"vm/images" = "chronobox/vm/images"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["vm: needs /dev/kvm and a built VM image (vm/fetch.sh, vm/build_rootfs.sh)"]
